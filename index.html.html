<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Coventry &amp; Warwickshire Pub Crawl</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  :root{
    --parchment:#EFE3C8;
    --parchment-dark:#E4D4AE;
    --ink:#2A2117;
    --ink-soft:#5C5245;
    --oxblood:#6B1E27;
    --oxblood-dark:#4E141B;
    --brass:#B8892B;
    --brass-light:#D9B15C;
    --hunter:#3F6B4F;
    --hunter-dark:#2E4F39;
    --brick:#A63A2E;
    --brick-dark:#7E2A21;
    --closed-grey:#8B8378;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--parchment);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }
  #app{ display:flex; flex-direction:column; height:100vh; }

  header{
    background:linear-gradient(180deg, var(--oxblood) 0%, var(--oxblood-dark) 100%);
    color:var(--parchment);
    padding:14px 16px 12px;
    box-shadow:0 3px 8px rgba(0,0,0,0.35);
    position:relative;
    z-index:20;
    border-bottom:3px solid var(--brass);
  }
  header h1{
    font-family:Georgia,'Iowan Old Style',serif;
    font-size:1.28rem;
    margin:0 0 2px;
    letter-spacing:0.3px;
    font-weight:700;
  }
  header .sub{
    font-size:0.72rem;
    color:var(--brass-light);
    letter-spacing:0.6px;
    text-transform:uppercase;
  }

  .stats-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
  }
  .stat-pill{
    background:rgba(0,0,0,0.22);
    border:1px solid rgba(217,177,92,0.4);
    border-radius:999px;
    padding:5px 12px;
    font-size:0.75rem;
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot.green{background:var(--hunter);box-shadow:0 0 0 2px rgba(63,107,79,0.35);}
  .dot.red{background:var(--brick);box-shadow:0 0 0 2px rgba(166,58,46,0.35);}

  .progress-track{
    flex:1;
    height:8px;
    background:rgba(0,0,0,0.28);
    border-radius:999px;
    overflow:hidden;
    border:1px solid rgba(217,177,92,0.3);
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--hunter-dark), var(--hunter));
    width:0%;
    transition:width 0.4s ease;
  }

  .controls{
    background:var(--parchment-dark);
    padding:10px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    border-bottom:1px solid rgba(107,30,39,0.15);
    position:relative;
    z-index:15;
  }
  .search-wrap{ position:relative; }
  #search{
    width:100%;
    padding:9px 12px 9px 34px;
    border-radius:8px;
    border:1px solid #C9B98A;
    background:#FBF6E9;
    color:var(--ink);
    font-size:0.92rem;
    outline:none;
  }
  #search:focus{ border-color:var(--brass); box-shadow:0 0 0 3px rgba(184,137,43,0.18); }
  .search-icon{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    font-size:0.9rem; color:var(--ink-soft); pointer-events:none;
  }

  .chip-row{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    padding:6px 12px;
    border-radius:999px;
    background:#FBF6E9;
    border:1px solid #C9B98A;
    color:var(--ink-soft);
    font-size:0.76rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
    transition:all 0.15s ease;
  }
  .chip.active{
    background:var(--oxblood);
    border-color:var(--oxblood);
    color:var(--parchment);
  }
  .chip.hide-closed.active{ background:var(--closed-grey); border-color:var(--closed-grey); }

  #map-wrap{ flex:1; position:relative; min-height:0; }
  #map{ position:absolute; inset:0; background:#DCE6D8; }

  .legend{
    position:absolute; left:10px; bottom:10px; z-index:500;
    background:rgba(239,227,200,0.95);
    border:1px solid #C9B98A;
    border-radius:10px;
    padding:8px 10px;
    font-size:0.72rem;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
    line-height:1.6;
  }
  .legend div{ display:flex; align-items:center; gap:6px; }
  .legend .sw{ width:11px; height:11px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,0.3);}
  .legend .sw.green{ background:var(--hunter); }
  .legend .sw.red{ background:var(--brick); }
  .legend .sw.grey{ background:var(--closed-grey); }

  .status-banner{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    z-index:600; background:rgba(42,33,23,0.92); color:var(--parchment);
    padding:7px 14px; border-radius:8px; font-size:0.78rem;
    display:flex; align-items:center; gap:8px;
    box-shadow:0 3px 10px rgba(0,0,0,0.3);
  }
  .spinner{
    width:12px; height:12px; border-radius:50%;
    border:2px solid rgba(239,227,200,0.35); border-top-color:var(--brass-light);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .retry-btn{
    background:var(--brass); color:var(--ink); border:none; border-radius:6px;
    padding:3px 9px; font-size:0.72rem; font-weight:700; cursor:pointer;
  }

  /* Leaflet marker */
  .pub-pin{
    width:22px; height:22px; border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    border:2px solid #fff;
    box-shadow:0 2px 5px rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
  }
  .pub-pin .glyph{ transform:rotate(45deg); font-size:11px; line-height:1; }
  .pub-pin.green{ background:var(--hunter); }
  .pub-pin.red{ background:var(--brick); }
  .pub-pin.closed{ opacity:0.55; filter:grayscale(0.4); }

  .leaflet-popup-content-wrapper{
    background:#FBF6E9; color:var(--ink);
    border-radius:10px;
    border:1px solid #C9B98A;
  }
  .leaflet-popup-tip{ background:#FBF6E9; }
  .pop-name{ font-family:Georgia,serif; font-weight:700; font-size:1.02rem; margin:0 0 3px; color:var(--oxblood-dark); }
  .pop-meta{ font-size:0.76rem; color:var(--ink-soft); margin-bottom:8px; }
  .pop-closed-tag{
    display:inline-block; background:var(--closed-grey); color:#fff;
    font-size:0.64rem; font-weight:700; padding:1px 7px; border-radius:999px;
    margin-left:6px; letter-spacing:0.3px; text-transform:uppercase;
  }
  .pop-btn{
    width:100%; border:none; border-radius:7px; padding:8px 10px;
    font-size:0.82rem; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .pop-btn.to-visit{ background:var(--hunter); color:#fff; }
  .pop-btn.visited{ background:transparent; color:var(--brick-dark); border:1.5px solid var(--brick); }

  .empty-msg{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:400; background:rgba(251,246,233,0.96); border:1px solid #C9B98A;
    padding:14px 18px; border-radius:10px; font-size:0.85rem; text-align:center;
    max-width:80%; box-shadow:0 3px 10px rgba(0,0,0,0.2); display:none;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🍺 Coventry &amp; Warwickshire Pub Crawl</h1>
    <div class="sub">Tap a pin to log your visit</div>
    <div class="stats-row">
      <div class="stat-pill"><span class="dot green"></span><span id="stat-visited">0</span> visited</div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="stat-pill"><span class="dot red"></span><span id="stat-remaining">0</span> left</div>
    </div>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="search" type="text" placeholder="Search pubs, areas or postcodes…" autocomplete="off">
    </div>
    <div class="chip-row">
      <div class="chip active" data-filter="all">All pubs</div>
      <div class="chip" data-filter="visited">Visited</div>
      <div class="chip" data-filter="not-visited">Not visited yet</div>
      <div class="chip hide-closed" id="hide-closed-chip">Hide closed</div>
    </div>
  </div>

  <div id="map-wrap">
    <div id="map"></div>
    <div class="legend">
      <div><span class="sw green"></span> Visited</div>
      <div><span class="sw red"></span> Not visited</div>
      <div><span class="sw grey"></span> Reported closed</div>
    </div>
    <div class="status-banner" id="status-banner" style="display:none;"></div>
    <div class="empty-msg" id="empty-msg">No pubs match your search/filter.</div>
  </div>
</div>

const VISITED_KEY = 'coventry-pubs-visited-v1';
const GEOCACHE_KEY = 'coventry-pubs-geocache-v1';

let visited = {};
let geocache = {};
let markers = {}; // id -> {marker, pub}
let map;
let currentFilter = 'all';
let hideClosed = false;

const statusBanner = document.getElementById('status-banner');
const emptyMsg = document.getElementById('empty-msg');

function showStatus(html){ statusBanner.style.display='flex'; statusBanner.innerHTML = html; }
function hideStatus(){ statusBanner.style.display='none'; }

function updateStats(){
  const total = PUBS.length;
  const visitedCount = Object.keys(visited).filter(k => visited[k]).length;
  document.getElementById('stat-visited').textContent = visitedCount;
  document.getElementById('stat-remaining').textContent = total - visitedCount;
  document.getElementById('progress-fill').style.width = (total ? (visitedCount/total*100) : 0) + '%';
}

async function loadVisited(){
  try{
    const r = await window.storage.get(VISITED_KEY, false);
    if (r && r.value) visited = JSON.parse(r.value);
  }catch(e){ visited = {}; }
}
async function saveVisited(){
  try{ await window.storage.set(VISITED_KEY, JSON.stringify(visited), false); }catch(e){}
}
async function loadGeocache(){
  try{
    const r = await window.storage.get(GEOCACHE_KEY, false);
    if (r && r.value) geocache = JSON.parse(r.value);
  }catch(e){ geocache = {}; }
}
async function saveGeocache(){
  try{ await window.storage.set(GEOCACHE_KEY, JSON.stringify(geocache), false); }catch(e){}
}

async function geocodeMissing(){
  const need = [...new Set(PUBS.map(p=>p.postcode))].filter(pc => !geocache[pc]);
  if (need.length === 0) return true;

  showStatus(`<span class="spinner"></span> Locating pubs on the map… (${need.length} postcodes)`);
  let ok = true;
  for (let i=0; i<need.length; i+=100){
    const chunk = need.slice(i, i+100);
    try{
      const res = await fetch('https://api.postcodes.io/postcodes', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ postcodes: chunk })
      });
      if (!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      (data.result || []).forEach(item=>{
        if (item.result){
          geocache[item.query] = [item.result.latitude, item.result.longitude];
        }
      });
    }catch(e){
      ok = false;
    }
  }
  await saveGeocache();
  return ok;
}

function pinDivIcon(pub){
  const isVisited = !!visited[pub.id];
  const cls = ['pub-pin', isVisited ? 'green':'red', pub.closed ? 'closed':''].join(' ');
  return L.divIcon({
    className:'',
    html:`<div class="${cls}"><span class="glyph">${isVisited?'✓':'🍺'}</span></div>`,
    iconSize:[26,26],
    iconAnchor:[13,24],
    popupAnchor:[0,-22]
  });
}

function popupHTML(pub){
  const isVisited = !!visited[pub.id];
  return `
    <div>
      <div class="pop-name">${pub.name}${pub.closed?'<span class="pop-closed-tag">Reported closed</span>':''}</div>
      <div class="pop-meta">${pub.area} · ${pub.postcode}</div>
      <button class="pop-btn ${isVisited?'visited':'to-visit'}" data-toggle="${pub.id}">
        ${isVisited ? '↺ Mark not visited' : '✓ Mark as visited'}
      </button>
    </div>`;
}

function toggleVisited(id){
  if (visited[id]) delete visited[id];
  else visited[id] = true;
  saveVisited();
  updateStats();
  refreshMarker(id);
  applyFilters();
}

function refreshMarker(id){
  const entry = markers[id];
  if (!entry) return;
  entry.marker.setIcon(pinDivIcon(entry.pub));
  entry.marker.setPopupContent(popupHTML(entry.pub));
}

function matchesFilter(pub){
  if (hideClosed && pub.closed) return false;
  if (currentFilter === 'visited' && !visited[pub.id]) return false;
  if (currentFilter === 'not-visited' && visited[pub.id]) return false;
  return true;
}

function matchesSearch(pub, q){
  if (!q) return true;
  q = q.toLowerCase();
  return pub.name.toLowerCase().includes(q) ||
         pub.area.toLowerCase().includes(q) ||
         pub.postcode.toLowerCase().includes(q);
}

function applyFilters(){
  const q = document.getElementById('search').value.trim();
  let visibleCount = 0;
  const bounds = [];
  Object.values(markers).forEach(({marker, pub})=>{
    const show = matchesFilter(pub) && matchesSearch(pub, q);
    if (show){
      if (!map.hasLayer(marker)) marker.addTo(map);
      visibleCount++;
      bounds.push(marker.getLatLng());
    } else {
      if (map.hasLayer(marker)) map.removeLayer(marker);
    }
  });
  emptyMsg.style.display = visibleCount === 0 ? 'block' : 'none';
  if (q && bounds.length){
    map.fitBounds(L.latLngBounds(bounds), { padding:[40,40], maxZoom:15 });
  }
}

function buildMarkers(){
  const bounds = [];
  PUBS.forEach(pub=>{
    const coords = geocache[pub.postcode];
    if (!coords) return;
    const marker = L.marker(coords, { icon: pinDivIcon(pub) });
    marker.bindPopup(popupHTML(pub));
    marker.on('popupopen', (e)=>{
      const el = e.popup.getElement();
      const btn = el.querySelector('[data-toggle]');
      if (btn){
        btn.addEventListener('click', ()=> toggleVisited(pub.id));
      }
    });
    marker.addTo(map);
    markers[pub.id] = { marker, pub };
    bounds.push(coords);
  });
  if (bounds.length){
    map.fitBounds(L.latLngBounds(bounds), { padding:[30,30] });
  }
  return bounds.length;
}

function wireControls(){
  document.getElementById('search').addEventListener('input', applyFilters);
  document.querySelectorAll('.chip[data-filter]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.chip[data-filter]').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      applyFilters();
    });
  });
  document.getElementById('hide-closed-chip').addEventListener('click', function(){
    hideClosed = !hideClosed;
    this.classList.toggle('active', hideClosed);
    applyFilters();
  });
}

async function init(){
  map = L.map('map', { zoomControl:true }).setView([52.408, -1.51], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);

  await Promise.all([loadVisited(), loadGeocache()]);
  updateStats();

  const geoOk = await geocodeMissing();
  const placed = buildMarkers();

  if (placed === 0){
    showStatus(`⚠️ Couldn't locate any pubs on the map. <button class="retry-btn" id="retry-btn">Retry</button>`);
    document.getElementById('retry-btn').addEventListener('click', async ()=>{
      hideStatus();
      showStatus('<span class="spinner"></span> Retrying…');
      const ok = await geocodeMissing();
      Object.values(markers).forEach(({marker})=>map.removeLayer(marker));
      markers = {};
      const n = buildMarkers();
      if (n>0) hideStatus();
      else showStatus(`⚠️ Still unable to load pub locations. <button class="retry-btn" id="retry-btn2">Retry</button>`);
    });
  } else if (!geoOk) {
    showStatus(`Located ${placed}/${PUBS.length} pubs — some postcodes failed`);
    setTimeout(hideStatus, 3500);
  } else {
    hideStatus();
  }

  wireControls();
  applyFilters();
}

init();
</script>
</body>
</html>
