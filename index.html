<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Coventry &amp; Warwickshire Pub Crawl</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  :root{
    --parchment:#EFE3C8;
    --parchment-dark:#E4D4AE;
    --ink:#2A2117;
    --ink-soft:#5C5245;
    --oxblood:#6B1E27;
    --oxblood-dark:#4E141B;
    --brass:#B8892B;
    --brass-light:#D9B15C;
    --hunter:#3F6B4F;
    --hunter-dark:#2E4F39;
    --brick:#A63A2E;
    --brick-dark:#7E2A21;
    --closed-grey:#8B8378;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--parchment);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }
  #app{ display:flex; flex-direction:column; height:100vh; }

  header{
    background:linear-gradient(180deg, var(--oxblood) 0%, var(--oxblood-dark) 100%);
    color:var(--parchment);
    padding:14px 16px 12px;
    box-shadow:0 3px 8px rgba(0,0,0,0.35);
    position:relative;
    z-index:20;
    border-bottom:3px solid var(--brass);
  }
  header h1{
    font-family:Georgia,'Iowan Old Style',serif;
    font-size:1.28rem;
    margin:0 0 2px;
    letter-spacing:0.3px;
    font-weight:700;
  }
  header .sub{
    font-size:0.72rem;
    color:var(--brass-light);
    letter-spacing:0.6px;
    text-transform:uppercase;
  }

  .stats-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
  }
  .stat-pill{
    background:rgba(0,0,0,0.22);
    border:1px solid rgba(217,177,92,0.4);
    border-radius:999px;
    padding:5px 12px;
    font-size:0.75rem;
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot.green{background:var(--hunter);box-shadow:0 0 0 2px rgba(63,107,79,0.35);}
  .dot.red{background:var(--brick);box-shadow:0 0 0 2px rgba(166,58,46,0.35);}
  #stat-pct-pill{ font-weight:700; color:var(--brass-light); }

  .progress-track{
    flex:1;
    height:8px;
    background:rgba(0,0,0,0.28);
    border-radius:999px;
    overflow:hidden;
    border:1px solid rgba(217,177,92,0.3);
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--hunter-dark), var(--hunter));
    width:0%;
    transition:width 0.4s ease;
  }

  .controls{
    background:var(--parchment-dark);
    padding:10px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    border-bottom:1px solid rgba(107,30,39,0.15);
    position:relative;
    z-index:15;
  }
  .search-wrap{ position:relative; }
  #search{
    width:100%;
    padding:9px 12px 9px 34px;
    border-radius:8px;
    border:1px solid #C9B98A;
    background:#FBF6E9;
    color:var(--ink);
    font-size:0.92rem;
    outline:none;
  }
  #search:focus{ border-color:var(--brass); box-shadow:0 0 0 3px rgba(184,137,43,0.18); }
  .search-icon{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    font-size:0.9rem; color:var(--ink-soft); pointer-events:none;
  }

  .chip-row{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    padding:6px 12px;
    border-radius:999px;
    background:#FBF6E9;
    border:1px solid #C9B98A;
    color:var(--ink-soft);
    font-size:0.76rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
    transition:all 0.15s ease;
  }
  .chip.active{
    background:var(--oxblood);
    border-color:var(--oxblood);
    color:var(--parchment);
  }

  #map-wrap{ flex:1; position:relative; min-height:0; }
  #map{ position:absolute; inset:0; background:#DCE6D8; }

  .legend{
    position:absolute; left:10px; bottom:10px; z-index:500;
    background:rgba(239,227,200,0.95);
    border:1px solid #C9B98A;
    border-radius:10px;
    padding:8px 10px;
    font-size:0.72rem;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
    line-height:1.6;
  }
  .legend div{ display:flex; align-items:center; gap:6px; }
  .legend .sw{ width:11px; height:11px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,0.3);}
  .legend .sw.green{ background:var(--hunter); }
  .legend .sw.red{ background:var(--brick); }

  .status-banner{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    z-index:600; background:rgba(42,33,23,0.92); color:var(--parchment);
    padding:7px 14px; border-radius:8px; font-size:0.78rem;
    display:flex; align-items:center; gap:8px;
    box-shadow:0 3px 10px rgba(0,0,0,0.3);
  }
  .spinner{
    width:12px; height:12px; border-radius:50%;
    border:2px solid rgba(239,227,200,0.35); border-top-color:var(--brass-light);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .retry-btn{
    background:var(--brass); color:var(--ink); border:none; border-radius:6px;
    padding:3px 9px; font-size:0.72rem; font-weight:700; cursor:pointer;
  }

  /* Leaflet marker */
  .pub-pin{
    width:22px; height:22px; border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    border:2px solid #fff;
    box-shadow:0 2px 5px rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
  }
  .pub-pin .glyph{ transform:rotate(45deg); font-size:11px; line-height:1; }
  .pub-pin.green{ background:var(--hunter); }
  .pub-pin.red{ background:var(--brick); }

  .leaflet-popup-content-wrapper{
    background:#FBF6E9; color:var(--ink);
    border-radius:10px;
    border:1px solid #C9B98A;
  }
  .leaflet-popup-tip{ background:#FBF6E9; }
  .pop-name{ font-family:Georgia,serif; font-weight:700; font-size:1.02rem; margin:0 0 3px; color:var(--oxblood-dark); }
  .pop-meta{ font-size:0.76rem; color:var(--ink-soft); margin-bottom:8px; }
  .pop-btn{
    width:100%; border:none; border-radius:7px; padding:8px 10px;
    font-size:0.82rem; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .pop-btn.to-visit{ background:var(--hunter); color:#fff; }
  .pop-btn.visited{ background:transparent; color:var(--brick-dark); border:1.5px solid var(--brick); }

  .chip.sync{ background:#FBF6E9; border-color:var(--brass); color:var(--oxblood-dark); font-weight:700; }
  .chip.sync.is-master{ background:var(--hunter); border-color:var(--hunter); color:#fff; }
  .chip.sync.is-viewer{ background:#EFE3C8; border-color:var(--brass); color:var(--ink-soft); }

  .modal-overlay{
    position:fixed; inset:0; z-index:2000;
    background:rgba(20,15,10,0.6);
    display:flex; align-items:center; justify-content:center;
    padding:16px;
  }
  .modal-card{
    background:var(--parchment); border:1px solid var(--brass);
    border-radius:14px; max-width:420px; width:100%;
    padding:20px; position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    max-height:85vh; overflow-y:auto;
  }
  .modal-close{
    position:absolute; top:10px; right:12px; cursor:pointer;
    font-size:1.1rem; color:var(--ink-soft); width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-card h2{ font-family:Georgia,serif; margin:0 0 10px; font-size:1.1rem; color:var(--oxblood-dark); padding-right:20px; }
  .modal-card p{ font-size:0.85rem; line-height:1.5; color:var(--ink-soft); margin:0 0 12px; }
  .modal-card ol{ font-size:0.83rem; line-height:1.6; color:var(--ink-soft); margin:0 0 14px; padding-left:20px; }
  .modal-card a{ color:var(--oxblood); font-weight:600; }
  .modal-card input[type=text]{
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid #C9B98A;
    background:#FBF6E9; font-size:0.88rem; margin-bottom:10px; outline:none;
  }
  .modal-card input[type=text]:focus{ border-color:var(--brass); box-shadow:0 0 0 3px rgba(184,137,43,0.18); }
  .modal-btn{
    width:100%; border:none; border-radius:8px; padding:10px 12px;
    font-size:0.88rem; font-weight:700; cursor:pointer; background:var(--oxblood); color:#fff;
    margin-bottom:8px;
  }
  .modal-btn.secondary{ background:transparent; border:1.5px solid var(--brass); color:var(--oxblood-dark); }
  .modal-link-box{
    display:flex; gap:6px; align-items:center; margin-bottom:12px;
  }
  .modal-link-box input{ flex:1; margin-bottom:0; font-size:0.78rem; }
  .modal-copy-btn{
    background:var(--brass); border:none; border-radius:7px; padding:9px 12px;
    font-weight:700; font-size:0.8rem; cursor:pointer; white-space:nowrap;
  }
  .modal-error{ color:var(--brick-dark); font-size:0.8rem; margin-bottom:10px; }
  .modal-success{ color:var(--hunter-dark); font-size:0.8rem; margin-bottom:10px; font-weight:600; }

  .empty-msg{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:400; background:rgba(251,246,233,0.96); border:1px solid #C9B98A;
    padding:14px 18px; border-radius:10px; font-size:0.85rem; text-align:center;
    max-width:80%; box-shadow:0 3px 10px rgba(0,0,0,0.2); display:none;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🍺 Coventry &amp; Warwickshire Pub Crawl</h1>
    <div class="sub">Tap a pin to log your visit</div>
    <div class="stats-row">
      <div class="stat-pill"><span class="dot green"></span><span id="stat-visited">0</span> visited</div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="stat-pill" id="stat-pct-pill"><span id="stat-pct">0%</span></div>
      <div class="stat-pill"><span class="dot red"></span><span id="stat-remaining">0</span> left</div>
    </div>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="search" type="text" placeholder="Search pubs, areas or postcodes…" autocomplete="off">
    </div>
    <div class="chip-row">
      <div class="chip active" data-filter="all">All pubs</div>
      <div class="chip" data-filter="visited">Visited</div>
      <div class="chip" data-filter="not-visited">Not visited yet</div>
      <div class="chip sync" id="sync-chip">🔗 Set up shared list</div>
    </div>
  </div>

  <div id="map-wrap">
    <div id="map"></div>
    <div class="legend">
      <div><span class="sw green"></span> Visited</div>
      <div><span class="sw red"></span> Not visited</div>
    </div>
    <div class="status-banner" id="status-banner" style="display:none;"></div>
    <div class="empty-msg" id="empty-msg">No pubs match your search/filter.</div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div class="modal-close" id="modal-close">✕</div>
    <div id="modal-body"></div>
  </div>
</div>

async function fetchRemote(){
  const res = await fetch(`${JSONBIN_BASE}/${binId}/latest`);
  if (!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  return (data.record && data.record.visited) ? data.record.visited : {};
}
async function pushRemote(){
  const res = await fetch(`${JSONBIN_BASE}/${binId}`, {
    method:'PUT',
    headers:{ 'Content-Type':'application/json', 'X-Master-Key': masterKey },
    body: JSON.stringify({ visited })
  });
  if (!res.ok) throw new Error('HTTP '+res.status);
}
async function createRemoteBin(key){
  const res = await fetch(JSONBIN_BASE, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'X-Master-Key': key,
      'X-Bin-Private': 'false',
      'X-Bin-Name': 'coventry-pub-crawl'
    },
    body: JSON.stringify({ visited: {} })
  });
  if (!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  return data.metadata.id;
}

function startPolling(){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    if (syncMode === 'solo') return;
    try{
      const remote = await fetchRemote();
      if (JSON.stringify(remote) !== JSON.stringify(visited)){
        visited = remote;
        updateStats();
        Object.keys(markers).forEach(id => refreshMarker(id));
        applyFilters();
      }
    }catch(e){ /* silent — will retry next tick */ }
  }, 12000);
  document.addEventListener('visibilitychange', ()=>{
    if (document.visibilityState === 'visible' && syncMode !== 'solo') refreshFromRemoteOnce();
  });
}
async function refreshFromRemoteOnce(){
  try{
    const remote = await fetchRemote();
    visited = remote;
    updateStats();
    Object.keys(markers).forEach(id => refreshMarker(id));
    applyFilters();
  }catch(e){}
}

function pinDivIcon(pub){
  const isVisited = !!visited[pub.id];
  const cls = ['pub-pin', isVisited ? 'green':'red'].join(' ');
  return L.divIcon({
    className:'',
    html:`<div class="${cls}"><span class="glyph">${isVisited?'✓':'🍺'}</span></div>`,
    iconSize:[26,26],
    iconAnchor:[13,24],
    popupAnchor:[0,-22]
  });
}

function popupHTML(pub){
  const isVisited = !!visited[pub.id];
  return `
    <div>
      <div class="pop-name">${pub.name}</div>
      <div class="pop-meta">${pub.area} · ${pub.postcode}</div>
      <button class="pop-btn ${isVisited?'visited':'to-visit'}" data-toggle="${pub.id}">
        ${isVisited ? '↺ Mark not visited' : '✓ Mark as visited'}
      </button>
    </div>`;
}

async function toggleVisited(id){
  if (syncMode === 'viewer'){
    openModal('enter-key');
    return;
  }
  const wasVisited = !!visited[id];
  if (wasVisited) delete visited[id];
  else visited[id] = true;

  updateStats();
  refreshMarker(id);
  applyFilters();

  if (syncMode === 'master'){
    try{
      await pushRemote();
    }catch(e){
      // revert on failure
      if (wasVisited) visited[id] = true; else delete visited[id];
      updateStats(); refreshMarker(id); applyFilters();
      showStatus('⚠️ Could not save to the shared list — check your connection');
      setTimeout(hideStatus, 3000);
    }
  } else {
    saveSolo();
  }
}

function refreshMarker(id){
  const entry = markers[id];
  if (!entry) return;
  entry.marker.setIcon(pinDivIcon(entry.pub));
  entry.marker.setPopupContent(popupHTML(entry.pub));
}

function matchesFilter(pub){
  if (currentFilter === 'visited' && !visited[pub.id]) return false;
  if (currentFilter === 'not-visited' && visited[pub.id]) return false;
  return true;
}

function matchesSearch(pub, q){
  if (!q) return true;
  q = q.toLowerCase();
  return pub.name.toLowerCase().includes(q) ||
         pub.area.toLowerCase().includes(q) ||
         pub.postcode.toLowerCase().includes(q);
}

function applyFilters(){
  const q = document.getElementById('search').value.trim();
  let visibleCount = 0;
  const bounds = [];
  Object.values(markers).forEach(({marker, pub})=>{
    const show = matchesFilter(pub) && matchesSearch(pub, q);
    if (show){
      if (!map.hasLayer(marker)) marker.addTo(map);
      visibleCount++;
      bounds.push(marker.getLatLng());
    } else {
      if (map.hasLayer(marker)) map.removeLayer(marker);
    }
  });
  emptyMsg.style.display = visibleCount === 0 ? 'block' : 'none';
  if (q && bounds.length){
    map.fitBounds(L.latLngBounds(bounds), { padding:[40,40], maxZoom:15 });
  }
}

function buildMarkers(){
  const bounds = [];
  PUBS.forEach(pub=>{
    const coords = GEOCODE[pub.postcode];
    if (!coords) return;
    const marker = L.marker(coords, { icon: pinDivIcon(pub) });
    marker.bindPopup(popupHTML(pub));
    marker.on('popupopen', (e)=>{
      const el = e.popup.getElement();
      const btn = el.querySelector('[data-toggle]');
      if (btn){
        btn.addEventListener('click', ()=> toggleVisited(pub.id));
      }
    });
    marker.addTo(map);
    markers[pub.id] = { marker, pub };
    bounds.push(coords);
  });
  if (bounds.length){
    map.fitBounds(L.latLngBounds(bounds), { padding:[30,30] });
  }
  return bounds.length;
}

function closeModal(){ modalOverlay.style.display = 'none'; }
function openModal(view, opts){
  modalOverlay.style.display = 'flex';
  renderModal(view, opts || {});
}

function renderModal(view, opts){
  if (view === 'setup'){
    modalBody.innerHTML = `
      <h2>Set up a shared pub tracker</h2>
      <p>This turns your progress into a live list everyone can see. You'll be the "master" who can mark pubs visited — friends open your link and watch it update.</p>
      <ol>
        <li>Get a free key at <a href="https://jsonbin.io" target="_blank" rel="noopener">jsonbin.io</a> (sign up, then copy your "X-Master-Key" from your account).</li>
        <li>Paste it below and create the shared list.</li>
      </ol>
      <input type="text" id="modal-key-input" placeholder="Paste your X-Master-Key here">
      <div id="modal-msg"></div>
      <button class="modal-btn" id="modal-create-btn">Create shared list</button>
      <button class="modal-btn secondary" id="modal-cancel-btn">Not now</button>
    `;
    document.getElementById('modal-cancel-btn').onclick = closeModal;
    document.getElementById('modal-create-btn').onclick = async ()=>{
      const key = document.getElementById('modal-key-input').value.trim();
      const msgEl = document.getElementById('modal-msg');
      if (!key){ msgEl.innerHTML = '<div class="modal-error">Paste your key first.</div>'; return; }
      msgEl.innerHTML = '<div class="modal-error" style="color:var(--ink-soft);">Creating…</div>';
      try{
        const newBinId = await createRemoteBin(key);
        binId = newBinId;
        masterKey = key;
        localStorage.setItem('pubcrawl-master-'+binId, key);
        const url = new URL(location.href);
        url.searchParams.set('bin', binId);
        history.replaceState(null, '', url.toString());
        syncMode = 'master';
        updateSyncChip();
        startPolling();
        renderModal('share-link', { url: url.toString() });
      }catch(e){
        msgEl.innerHTML = '<div class="modal-error">Couldn\'t create the shared list. Double check your key and try again.</div>';
      }
    };
  } else if (view === 'share-link'){
    modalBody.innerHTML = `
      <h2>Shared list is live 🎉</h2>
      <p>Send this link to your friends — anyone who opens it sees the same tracker. Only this device can mark pubs (your master key is saved locally here).</p>
      <div class="modal-link-box">
        <input type="text" id="modal-share-url" value="${opts.url}" readonly>
        <button class="modal-copy-btn" id="modal-copy-btn">Copy</button>
      </div>
      <p style="font-size:0.75rem;">Note: this link only works once the file itself is hosted somewhere with a real URL (e.g. GitHub Pages) — if you're viewing this straight from a downloaded file, host it first, then re-open it from that hosted URL so the link above is shareable.</p>
      <button class="modal-btn secondary" id="modal-done-btn">Done</button>
    `;
    document.getElementById('modal-copy-btn').onclick = ()=>{
      const input = document.getElementById('modal-share-url');
      input.select();
      navigator.clipboard && navigator.clipboard.writeText(input.value).catch(()=>{ document.execCommand('copy'); });
      document.getElementById('modal-copy-btn').textContent = 'Copied!';
      setTimeout(()=>{ document.getElementById('modal-copy-btn').textContent = 'Copy'; }, 1500);
    };
    document.getElementById('modal-done-btn').onclick = closeModal;
  } else if (view === 'enter-key'){
    modalBody.innerHTML = `
      <h2>Get edit access</h2>
      <p>You're viewing this shared list read-only. If you're the tracker's master, paste your saved X-Master-Key to enable editing on this device.</p>
      <input type="text" id="modal-key-input2" placeholder="Paste your X-Master-Key here">
      <div id="modal-msg2"></div>
      <button class="modal-btn" id="modal-unlock-btn">Enable editing</button>
      <button class="modal-btn secondary" id="modal-cancel-btn2">Cancel</button>
    `;
    document.getElementById('modal-cancel-btn2').onclick = closeModal;
    document.getElementById('modal-unlock-btn').onclick = async ()=>{
      const key = document.getElementById('modal-key-input2').value.trim();
      const msgEl = document.getElementById('modal-msg2');
      if (!key){ msgEl.innerHTML = '<div class="modal-error">Paste your key first.</div>'; return; }
      msgEl.innerHTML = '<div class="modal-error" style="color:var(--ink-soft);">Checking…</div>';
      const prev = JSON.stringify(visited);
      try{
        masterKey = key;
        await pushRemote(); // validates the key works for this bin
        localStorage.setItem('pubcrawl-master-'+binId, key);
        syncMode = 'master';
        updateSyncChip();
        closeModal();
      }catch(e){
        masterKey = null;
        msgEl.innerHTML = '<div class="modal-error">That key didn\'t work for this shared list.</div>';
      }
    };
  }
}

function wireControls(){
  document.getElementById('modal-close').addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e)=>{ if (e.target === modalOverlay) closeModal(); });
  syncChip.addEventListener('click', ()=>{
    if (syncMode === 'solo') openModal('setup');
    else if (syncMode === 'master') openModal('share-link', { url: location.href });
    else openModal('enter-key');
  });
  document.getElementById('search').addEventListener('input', applyFilters);
  document.querySelectorAll('.chip[data-filter]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.chip[data-filter]').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      applyFilters();
    });
  });
}

async function init(){
  map = L.map('map', { zoomControl:true }).setView([52.408, -1.51], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);

  const params = new URLSearchParams(location.search);
  binId = params.get('bin');

  if (binId){
    masterKey = localStorage.getItem('pubcrawl-master-'+binId);
    syncMode = masterKey ? 'master' : 'viewer';
    showStatus('<span class="spinner"></span> Loading shared list…');
    try{
      visited = await fetchRemote();
      hideStatus();
    }catch(e){
      visited = {};
      showStatus('⚠️ Could not reach the shared list — showing empty map');
      setTimeout(hideStatus, 3500);
    }
    startPolling();
  } else {
    syncMode = 'solo';
    loadSolo();
  }

  updateSyncChip();
  updateStats();

  const placed = buildMarkers();
  if (placed < PUBS.length){
    const msg = `Placed ${placed}/${PUBS.length} pubs on the map`;
    showStatus(msg);
    setTimeout(hideStatus, 3000);
  }

  wireControls();
  applyFilters();
}

init();
</script>
