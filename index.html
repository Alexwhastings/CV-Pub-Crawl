<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Coventry &amp; Warwickshire Pub Crawl</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  :root{
    --parchment:#EFE3C8;
    --parchment-dark:#E4D4AE;
    --ink:#2A2117;
    --ink-soft:#5C5245;
    --oxblood:#6B1E27;
    --oxblood-dark:#4E141B;
    --brass:#B8892B;
    --brass-light:#D9B15C;
    --hunter:#3F6B4F;
    --hunter-dark:#2E4F39;
    --brick:#A63A2E;
    --brick-dark:#7E2A21;
    --teal:#2E6E7E;
    --teal-dark:#20505C;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--parchment);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }
  #app{ display:flex; flex-direction:column; height:100vh; }

  header{
    background:linear-gradient(180deg, var(--oxblood) 0%, var(--oxblood-dark) 100%);
    color:var(--parchment);
    padding:12px 16px 10px;
    box-shadow:0 3px 8px rgba(0,0,0,0.35);
    position:relative;
    z-index:20;
    border-bottom:3px solid var(--brass);
  }
  header h1{
    font-family:Georgia,'Iowan Old Style',serif;
    font-size:1.18rem;
    margin:0 0 6px;
    letter-spacing:0.3px;
    font-weight:700;
  }

  .person-bars{ display:flex; flex-direction:column; gap:5px; }
  .person-bar-row{ display:flex; align-items:center; gap:7px; }
  .person-name{
    font-size:0.68rem; font-weight:700; width:34px; flex:0 0 34px;
    text-transform:uppercase; letter-spacing:0.3px;
  }
  .person-bar-row.alex .person-name{ background:var(--hunter); border-radius:4px; padding:1px 0; text-align:center; color:#fff;}
  .person-bar-row.rhys .person-name{ background:var(--teal); border-radius:4px; padding:1px 0; text-align:center; color:#fff;}
  .person-bar-row.jack .person-name{ background:var(--brass); border-radius:4px; padding:1px 0; text-align:center; color:#2A2117;}

  .p-progress-track{
    flex:1; height:7px; background:rgba(0,0,0,0.28); border-radius:999px; overflow:hidden;
    border:1px solid rgba(217,177,92,0.25);
  }
  .p-progress-fill{ height:100%; width:0%; transition:width 0.4s ease; }
  .person-bar-row.alex .p-progress-fill{ background:linear-gradient(90deg, var(--hunter-dark), var(--hunter)); }
  .person-bar-row.rhys .p-progress-fill{ background:linear-gradient(90deg, var(--teal-dark), var(--teal)); }
  .person-bar-row.jack .p-progress-fill{ background:linear-gradient(90deg, #8A6620, var(--brass)); }

  .p-count{ font-size:0.68rem; width:56px; flex:0 0 56px; text-align:right; color:var(--brass-light); }

  .controls{
    background:var(--parchment-dark);
    padding:8px 12px;
    display:flex;
    flex-direction:column;
    gap:7px;
    border-bottom:1px solid rgba(107,30,39,0.15);
    position:relative;
    z-index:15;
  }
  .search-wrap{ position:relative; }
  #search{
    width:100%;
    padding:9px 12px 9px 34px;
    border-radius:8px;
    border:1px solid #C9B98A;
    background:#FBF6E9;
    color:var(--ink);
    font-size:0.92rem;
    outline:none;
  }
  #search:focus{ border-color:var(--brass); box-shadow:0 0 0 3px rgba(184,137,43,0.18); }
  .search-icon{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    font-size:0.9rem; color:var(--ink-soft); pointer-events:none;
  }

  .chip-row{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    padding:6px 12px;
    border-radius:999px;
    background:#FBF6E9;
    border:1px solid #C9B98A;
    color:var(--ink-soft);
    font-size:0.76rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
    transition:all 0.15s ease;
  }
  .chip.active{ background:var(--oxblood); border-color:var(--oxblood); color:var(--parchment); }
  .chip.view-alex.active{ background:var(--hunter); border-color:var(--hunter); }
  .chip.view-rhys.active{ background:var(--teal); border-color:var(--teal); }
  .chip.view-jack.active{ background:var(--brass); border-color:var(--brass); color:var(--ink); }
  .chip.sync{ background:#FBF6E9; border-color:var(--brass); color:var(--oxblood-dark); font-weight:700; }
  .chip.sync.is-master{ background:var(--hunter); border-color:var(--hunter); color:#fff; }
  .chip.sync.is-viewer{ background:#EFE3C8; border-color:var(--brass); color:var(--ink-soft); }

  #content-wrap{ flex:1; position:relative; min-height:0; }
  #map{ position:absolute; inset:0; background:#DCE6D8; }
  #map.hidden{ display:none; }

  #list-view{ position:absolute; inset:0; overflow-y:auto; background:var(--parchment); display:none; padding:6px 10px 60px; }
  #list-view.visible{ display:block; }
  .list-row{
    background:#FBF6E9; border:1px solid #D9C9A0; border-radius:10px;
    padding:9px 11px; margin-bottom:7px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .list-row-info{ min-width:0; }
  .list-row-name{ font-family:Georgia,serif; font-weight:700; font-size:0.92rem; color:var(--oxblood-dark); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list-row-meta{ font-size:0.72rem; color:var(--ink-soft); }
  .list-row-toggles{ display:flex; gap:5px; flex:0 0 auto; }
  .mini-toggle{
    min-width:28px; height:28px; padding:0 3px; border-radius:14px; border:2px solid #C9B98A;
    background:#EFE3C8; font-size:0.66rem; font-weight:800; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink-soft);
  }
  .mini-toggle.on.alex{ background:var(--hunter); border-color:var(--hunter); color:#fff; }
  .mini-toggle.on.rhys{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .mini-toggle.on.jack{ background:var(--brass); border-color:var(--brass); color:var(--ink); }

  .legend{
    position:absolute; left:10px; bottom:10px; z-index:500;
    background:rgba(239,227,200,0.95);
    border:1px solid #C9B98A;
    border-radius:10px;
    padding:8px 10px;
    font-size:0.72rem;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
    line-height:1.6;
  }
  .legend div{ display:flex; align-items:center; gap:6px; }
  .legend .sw{ width:11px; height:11px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,0.3);}
  .legend .sw.green{ background:var(--hunter); }
  .legend .sw.red{ background:var(--brick); }

  .status-banner{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    z-index:600; background:rgba(42,33,23,0.92); color:var(--parchment);
    padding:7px 14px; border-radius:8px; font-size:0.78rem;
    display:flex; align-items:center; gap:8px;
    box-shadow:0 3px 10px rgba(0,0,0,0.3);
  }
  .spinner{
    width:12px; height:12px; border-radius:50%;
    border:2px solid rgba(239,227,200,0.35); border-top-color:var(--brass-light);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Leaflet marker */
  .pub-pin{
    width:22px; height:22px; border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    border:2px solid #fff;
    box-shadow:0 2px 5px rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
  }
  .pub-pin .glyph{ transform:rotate(45deg); font-size:11px; line-height:1; }
  .pub-pin.green{ background:var(--hunter); }
  .pub-pin.red{ background:var(--brick); }

  .leaflet-popup-content-wrapper{
    background:#FBF6E9; color:var(--ink);
    border-radius:10px;
    border:1px solid #C9B98A;
  }
  .leaflet-popup-tip{ background:#FBF6E9; }
  .pop-name{ font-family:Georgia,serif; font-weight:700; font-size:1.02rem; margin:0 0 3px; color:var(--oxblood-dark); }
  .pop-meta{ font-size:0.76rem; color:var(--ink-soft); margin-bottom:8px; }
  .pop-toggles{ display:flex; gap:8px; }
  .pop-toggle{
    flex:1; border:1.5px solid #C9B98A; border-radius:8px; padding:7px 4px;
    font-size:0.72rem; font-weight:700; text-align:center; cursor:pointer; background:#EFE3C8; color:var(--ink-soft);
  }
  .pop-toggle.on.alex{ background:var(--hunter); border-color:var(--hunter); color:#fff; }
  .pop-toggle.on.rhys{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .pop-toggle.on.jack{ background:var(--brass); border-color:var(--brass); color:var(--ink); }

  .pub-detail{ min-width:200px; }
  .person-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .person-row .pop-toggle{ flex:0 0 74px; }
  .stars{ display:flex; gap:2px; font-size:1.05rem; line-height:1; }
  .star-wrap{ position:relative; display:inline-block; width:1.05rem; height:1.05rem; }
  .star-bg, .star-fg{ position:absolute; top:0; left:0; font-size:1.05rem; line-height:1; white-space:nowrap; }
  .star-bg{ color:#D9CCA8; }
  .star-fg{ overflow:hidden; }
  .star-wrap.alex .star-fg{ color:var(--hunter); }
  .star-wrap.rhys .star-fg{ color:var(--teal); }
  .star-wrap.jack .star-fg{ color:var(--brass); }
  .star-hit{ position:absolute; top:0; height:100%; width:50%; cursor:pointer; }
  .star-hit.left{ left:0; }
  .star-hit.right{ left:50%; }
  .stars-hint{ font-size:0.66rem; color:var(--ink-soft); opacity:0.7; font-style:italic; }

  .modal-overlay{
    position:fixed; inset:0; z-index:2000;
    background:rgba(20,15,10,0.6);
    display:flex; align-items:center; justify-content:center;
    padding:16px;
  }
  .modal-card{
    background:var(--parchment); border:1px solid var(--brass);
    border-radius:14px; max-width:420px; width:100%;
    padding:20px; position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    max-height:85vh; overflow-y:auto;
  }
  .modal-close{
    position:absolute; top:10px; right:12px; cursor:pointer;
    font-size:1.1rem; color:var(--ink-soft); width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-card h2{ font-family:Georgia,serif; margin:0 0 10px; font-size:1.1rem; color:var(--oxblood-dark); padding-right:20px; }
  .modal-card p{ font-size:0.85rem; line-height:1.5; color:var(--ink-soft); margin:0 0 12px; }
  .modal-card ol{ font-size:0.83rem; line-height:1.6; color:var(--ink-soft); margin:0 0 14px; padding-left:20px; }
  .modal-card a{ color:var(--oxblood); font-weight:600; }
  .modal-card input[type=text]{
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid #C9B98A;
    background:#FBF6E9; font-size:0.88rem; margin-bottom:10px; outline:none;
  }
  .modal-btn{
    width:100%; border:none; border-radius:8px; padding:10px 12px;
    font-size:0.88rem; font-weight:700; cursor:pointer; background:var(--oxblood); color:#fff;
    margin-bottom:8px;
  }
  .modal-btn.secondary{ background:transparent; border:1.5px solid var(--brass); color:var(--oxblood-dark); }
  .modal-link-box{ display:flex; gap:6px; align-items:center; margin-bottom:12px; }
  .modal-link-box input{ flex:1; margin-bottom:0; font-size:0.78rem; }
  .modal-copy-btn{
    background:var(--brass); border:none; border-radius:7px; padding:9px 12px;
    font-weight:700; font-size:0.8rem; cursor:pointer; white-space:nowrap;
  }
  .modal-error{ color:var(--brick-dark); font-size:0.8rem; margin-bottom:10px; }

  .empty-msg{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:400; background:rgba(251,246,233,0.96); border:1px solid #C9B98A;
    padding:14px 18px; border-radius:10px; font-size:0.85rem; text-align:center;
    max-width:80%; box-shadow:0 3px 10px rgba(0,0,0,0.2); display:none;
  }
</style>
</head>

<div id="app">
  <header>

    <div class="person-bars">
      <div class="person-bar-row alex">
        <div class="person-name">Alex</div>
        <div class="p-progress-track"><div class="p-progress-fill" id="fill-alex"></div></div>
        <div class="p-count" id="count-alex">0/0 · 0%</div>
      </div>
      <div class="person-bar-row rhys">
        <div class="person-name">Rhys</div>
        <div class="p-progress-track"><div class="p-progress-fill" id="fill-rhys"></div></div>
        <div class="p-count" id="count-rhys">0/0 · 0%</div>

      <div class="person-bar-row jack">

        <div class="p-progress-track"><div class="p-progress-fill" id="fill-jack"></div></div>
        <div class="p-count" id="count-jack">0/0 · 0%</div>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="search" type="text" placeholder="Search pubs, areas or postcodes…" autocomplete="off">
    </div>
    <div class="chip-row">
      <div class="chip view-alex active" data-person="alex">Map: Alex</div>
      <div class="chip view-rhys" data-person="rhys">Map: Rhys</div>
      <div class="chip view-jack" data-person="jack">Map: Jack</div>
    </div>
    <div class="chip-row">
      <div class="chip active" data-filter="all">All pubs</div>
      <div class="chip" data-filter="visited">Visited</div>
      <div class="chip" data-filter="not-visited">Not visited yet</div>
      <div class="chip" id="view-toggle-chip" data-view="map">📋 List view</div>
      <div class="chip sync" id="sync-chip">🔗 Set up shared list</div>
    </div>
  </div>

  <div id="content-wrap">
    <div id="map"></div>
    <div id="list-view"></div>
    <div class="legend" id="legend">
      <div><span class="sw green"></span> Visited</div>
      <div><span class="sw red"></span> Not visited</div>
    </div>
    <div class="status-banner" id="status-banner" style="display:none;"></div>
    <div class="empty-msg" id="empty-msg">No pubs match your search/filter.</div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div class="modal-close" id="modal-close">✕</div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

function migrateVisited(v){
  let changed = false;
  const out = {};
  Object.keys(v).forEach(k=>{
    const newKey = (/^\d+$/.test(k) && OLD_ID_MAP[k]) ? OLD_ID_MAP[k] : k;
    if (newKey !== k) changed = true;
    const personData = v[k] || {};
    const normPerson = {};
    Object.keys(personData).forEach(person=>{
      const val = personData[person];
      if (typeof val === 'boolean'){
        normPerson[person] = { v: val, r: 0 };
        changed = true;
      } else {
        normPerson[person] = { v: !!(val && val.v), r: (val && val.r) || 0 };
      }
    });
    out[newKey] = normPerson;
  });
  return { data: out, changed };
}

function isVisitedBy(pubId, person){ return !!(visited[pubId] && visited[pubId][person] && visited[pubId][person].v); }
function getRating(pubId, person){ return (visited[pubId] && visited[pubId][person] && visited[pubId][person].r) || 0; }

function updateStats(){
  const total = PUBS.length;
  PEOPLE.forEach(person => {
    const count = PUBS.filter(p => isVisitedBy(p.id, person)).length;
    const pct = total ? Math.round(count/total*100) : 0;
    document.getElementById('fill-'+person).style.width = pct + '%';
    document.getElementById('count-'+person).textContent = count + '/' + total + ' · ' + pct + '%';
  });
}

  } else if (syncMode === 'viewer'){
    syncChip.textContent = '🔗 Synced — view only';
    syncChip.className = 'chip sync is-viewer';
  } else {
    syncChip.textContent = '🔗 Set up shared list';
    syncChip.className = 'chip sync';
  }
}

// ---------- Local (solo, per-device) persistence ----------
function loadSolo(){
  try{
    const parsed = JSON.parse(localStorage.getItem(SOLO_KEY) || '{}');
    visited = (parsed && ('visited' in parsed)) ? (parsed.visited || {}) : (parsed || {});
  }catch(e){ visited = {}; }
}
function saveSolo(){
  try{ localStorage.setItem(SOLO_KEY, JSON.stringify({ visited })); }catch(e){}
}

// ---------- Cloud (shared) persistence via JSONBin.io ----------
async function fetchRemote(){
  const res = await fetch(`${JSONBIN_BASE}/${binId}/latest`);
  if (!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  return (data.record && data.record.visited) ? data.record.visited : {};
}
async function pushRemote(){
  const res = await fetch(`${JSONBIN_BASE}/${binId}`, {
    method:'PUT',
    headers:{ 'Content-Type':'application/json', 'X-Master-Key': masterKey },
    body: JSON.stringify({ visited })
  });
  if (!res.ok) throw new Error('HTTP '+res.status);
}
async function createRemoteBin(key){
  const res = await fetch(JSONBIN_BASE, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'X-Master-Key': key,
      'X-Bin-Private': 'false',
      'X-Bin-Name': 'coventry-pub-crawl'
    },
    body: JSON.stringify({ visited: {} })
  });
  if (!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  return data.metadata.id;
}

function startPolling(){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    if (syncMode === 'solo') return;
    try{
      const remote = await fetchRemote();
      if (JSON.stringify(remote) !== JSON.stringify(visited)){
        visited = remote;
        refreshAll();
      }
    }catch(e){}
  }, 120000);
  document.addEventListener('visibilitychange', ()=>{
    if (document.visibilityState === 'visible' && syncMode !== 'solo') refreshFromRemoteOnce();
  });
}
async function refreshFromRemoteOnce(){
  try{
    const remote = await fetchRemote();
    visited = remote;
    refreshAll();
  }catch(e){}
}

function refreshAll(){
  updateStats();
  Object.keys(markers).forEach(id => refreshMarker(id));
  if (currentView === 'list') renderListView();
  applyFilters();
}

function pinDivIcon(pub){
  const isVisited = isVisitedBy(pub.id, activePerson);
  const cls = ['pub-pin', isVisited ? 'green':'red'].join(' ');
  return L.divIcon({
    className:'',
    html:`<div class="${cls}"><span class="glyph">${isVisited?'✓':'🍺'}</span></div>`,
    iconSize:[26,26],
    iconAnchor:[13,24],
    popupAnchor:[0,-22]
  });
}

function starsHTML(pubId, person, rating){
  let s = '';
  for(let i=1;i<=5;i++){
    let fillPct = 0;
    if (rating >= i) fillPct = 100;
    else if (rating >= i - 0.5) fillPct = 50;
    s += `
      <span class="star-wrap ${person}">
        <span class="star-bg">★</span>
        <span class="star-fg" style="width:${fillPct}%">★</span>
        <span class="star-hit left" data-star="${i-0.5}" data-person="${person}" data-pub="${pubId}"></span>
        <span class="star-hit right" data-star="${i}" data-person="${person}" data-pub="${pubId}"></span>
      </span>`;
  }
  return s;
}

function personRowHTML(pub, person){
  const on = isVisitedBy(pub.id, person);
  const rating = getRating(pub.id, person);
  return `
    <div class="person-row">
      <div class="pop-toggle ${on?'on':''} ${person}" data-toggle-person="${person}" data-pub="${pub.id}">${PEOPLE_LABEL[person]}${on?' ✓':''}</div>
      ${on ? `<div class="stars">${starsHTML(pub.id, person, rating)}</div>` : `<div class="stars stars-hint">rate once visited</div>`}
    </div>`;
}

function popupHTML(pub){
  return `
    <div class="pub-detail">
      <div class="pop-name">${pub.name}</div>
      <div class="pop-meta">${pub.area} · ${pub.postcode}</div>
      ${PEOPLE.map(p=>personRowHTML(pub,p)).join('')}
    </div>`;
}

// Single delegated click handler shared by the map popup and the list-view detail modal.
// Delegation (rather than binding to individual buttons) means it keeps working correctly
// even after the content is re-rendered in place — e.g. tapping a star, then a toggle,
// then another star, all within the same open popup.
function wireDetailContainer(container){
  container.addEventListener('click', (e)=>{
    const toggleBtn = e.target.closest('[data-toggle-person]');
    if (toggleBtn){ togglePerson(toggleBtn.dataset.pub, toggleBtn.dataset.togglePerson); return; }
    const star = e.target.closest('[data-star]');
    if (star){ setRating(star.dataset.pub, star.dataset.person, parseFloat(star.dataset.star)); return; }
  });
}

async function persistChange(revert){
  if (syncMode === 'master'){
    try{ await pushRemote(); }
    catch(e){
      revert();
      showStatus('⚠️ Could not save to the shared list — check your connection');
      setTimeout(hideStatus, 3000);
    }
  } else {
    saveSolo();
  }
}

async function togglePerson(pubId, person){
  if (syncMode === 'viewer'){ openModal('enter-key'); return; }
  if (!visited[pubId]) visited[pubId] = {};
  if (!visited[pubId][person]) visited[pubId][person] = { v:false, r:0 };
  const prev = { ...visited[pubId][person] };
  visited[pubId][person].v = !prev.v;

  refreshAllFor(pubId);
  await persistChange(()=>{ visited[pubId][person] = prev; refreshAllFor(pubId); });
}

async function setRating(pubId, person, rating){
  if (syncMode === 'viewer'){ openModal('enter-key'); return; }
  if (!visited[pubId]) visited[pubId] = {};
  if (!visited[pubId][person]) visited[pubId][person] = { v:false, r:0 };
  const prev = { ...visited[pubId][person] };
  // tapping the same star again clears the rating; otherwise sets it (and implies visited)
  visited[pubId][person].r = (prev.r === rating) ? 0 : rating;
  visited[pubId][person].v = true;

  refreshAllFor(pubId);
  await persistChange(()=>{ visited[pubId][person] = prev; refreshAllFor(pubId); });
}

function refreshAllFor(pubId){
  updateStats();
  refreshMarker(pubId);
  if (currentView === 'list') renderListView();
  applyFilters();
  if (modalOverlay.style.display === 'flex' && modalOverlay.dataset.detailPub === pubId){
    renderDetailModal(pubId);
  }
}

function refreshMarker(id){
  const entry = markers[id];
  if (!entry) return;
  entry.marker.setIcon(pinDivIcon(entry.pub));
  entry.marker.setPopupContent(popupHTML(entry.pub));
}

function matchesFilter(pub){
  if (currentFilter === 'visited' && !isVisitedBy(pub.id, activePerson)) return false;
  if (currentFilter === 'not-visited' && isVisitedBy(pub.id, activePerson)) return false;
  return true;
}
function matchesSearch(pub, q){
  if (!q) return true;
  q = q.toLowerCase();
  return pub.name.toLowerCase().includes(q) || pub.area.toLowerCase().includes(q) || pub.postcode.toLowerCase().includes(q);
}

function applyFilters(){
  const q = document.getElementById('search').value.trim();
  if (currentView === 'map'){
    let visibleCount = 0;
    const bounds = [];
    Object.values(markers).forEach(({marker, pub})=>{
      const show = matchesFilter(pub) && matchesSearch(pub, q);
      if (show){
        if (!map.hasLayer(marker)) marker.addTo(map);
        visibleCount++;
        bounds.push(marker.getLatLng());
      } else {
        if (map.hasLayer(marker)) map.removeLayer(marker);
      }
    });
    emptyMsg.style.display = visibleCount === 0 ? 'block' : 'none';
    if (q && bounds.length){
      map.fitBounds(L.latLngBounds(bounds), { padding:[40,40], maxZoom:15 });
    }
  } else {
    renderListView();
  }
}

function renderListView(){
  const q = document.getElementById('search').value.trim();
  const rows = PUBS.filter(pub => matchesFilter(pub) && matchesSearch(pub, q));
  emptyMsg.style.display = rows.length === 0 ? 'block' : 'none';
  listView.innerHTML = rows.map(pub => `
    <div class="list-row">
      <div class="list-row-info" data-open-detail="${pub.id}">
        <div class="list-row-name">${pub.name}</div>
        <div class="list-row-meta">${pub.area} · ${pub.postcode}</div>
      </div>
      <div class="list-row-toggles">
        ${PEOPLE.map(p => {
          const r = getRating(pub.id,p);
          const label = PEOPLE_LABEL[p][0] + (r>0 ? r : '');
          return `<div class="mini-toggle ${isVisitedBy(pub.id,p)?'on '+p:''}" data-toggle-person="${p}" data-pub="${pub.id}">${label}</div>`;
        }).join('')}
      </div>
    </div>
  `).join('');
  listView.querySelectorAll('[data-toggle-person]').forEach(el=>{
    el.addEventListener('click', ()=> togglePerson(el.dataset.pub, el.dataset.togglePerson));
  });
  listView.querySelectorAll('[data-open-detail]').forEach(el=>{
    el.addEventListener('click', ()=> openPubDetail(el.dataset.openDetail));
  });
}

function buildMarkers(){
  const bounds = [];
  PUBS.forEach(pub=>{
    const coords = GEOCODE[pub.postcode];
    if (!coords) return;
    const marker = L.marker(coords, { icon: pinDivIcon(pub) });
    marker.bindPopup(popupHTML(pub), { minWidth: 220 });
    marker.on('popupopen', (e)=>{
      const el = e.popup.getElement();
      wireDetailContainer(el);
    });
    marker.addTo(map);
    markers[pub.id] = { marker, pub };
    bounds.push(coords);
  });
  if (bounds.length){
    map.fitBounds(L.latLngBounds(bounds), { padding:[30,30] });
  }
  return bounds.length;
}

function switchView(view){
  currentView = view;
  const chip = document.getElementById('view-toggle-chip');
  if (view === 'list'){
    mapEl.classList.add('hidden');
    legendEl.style.display = 'none';
    listView.classList.add('visible');
    chip.textContent = '🗺️ Map view';
    chip.dataset.view = 'list';
    renderListView();
  } else {
    mapEl.classList.remove('hidden');
    legendEl.style.display = 'block';
    listView.classList.remove('visible');
    chip.textContent = '📋 List view';
    chip.dataset.view = 'map';
    applyFilters();
  }
}

function closeModal(){ modalOverlay.style.display = 'none'; delete modalOverlay.dataset.detailPub; }
function openModal(view, opts){
  modalOverlay.style.display = 'flex';
  renderModal(view, opts || {});
}

function renderDetailModal(pubId){
  const pub = PUBS.find(p=>p.id===pubId);
  if (!pub) return;
  modalBody.innerHTML = popupHTML(pub);
}
function openPubDetail(pubId){
  modalOverlay.style.display = 'flex';
  modalOverlay.dataset.detailPub = pubId;
  renderDetailModal(pubId);
}

function renderModal(view, opts){
  if (view === 'setup'){
    modalBody.innerHTML = `
      <h2>Set up a shared pub tracker</h2>
      <p>This turns your progress into a live list everyone can see. You'll be the "master" who can mark pubs visited for Alex, Rhys or Jack — friends open your link and watch it update.</p>
      <ol>
        <li>Get a free key at <a href="https://jsonbin.io" target="_blank" rel="noopener">jsonbin.io</a> (sign up, then copy your "X-Master-Key" from your account).</li>
        <li>Paste it below and create the shared list.</li>
      </ol>
      <input type="text" id="modal-key-input" placeholder="Paste your X-Master-Key here">
      <div id="modal-msg"></div>
      <button class="modal-btn" id="modal-create-btn">Create shared list</button>
      <button class="modal-btn secondary" id="modal-cancel-btn">Not now</button>
    `;
    document.getElementById('modal-cancel-btn').onclick = closeModal;
    document.getElementById('modal-create-btn').onclick = async ()=>{
      const key = document.getElementById('modal-key-input').value.trim();
      const msgEl = document.getElementById('modal-msg');
      if (!key){ msgEl.innerHTML = '<div class="modal-error">Paste your key first.</div>'; return; }
      msgEl.innerHTML = '<div class="modal-error" style="color:var(--ink-soft);">Creating…</div>';
      try{
        const newBinId = await createRemoteBin(key);
        binId = newBinId;
        masterKey = key;
        localStorage.setItem('pubcrawl-master-'+binId, key);
        const url = new URL(location.href);
        url.searchParams.set('bin', binId);
        history.replaceState(null, '', url.toString());
        syncMode = 'master';
        updateSyncChip();
        startPolling();
        renderModal('share-link', { url: url.toString() });
      }catch(e){
        msgEl.innerHTML = '<div class="modal-error">Couldn\'t create the shared list. Double check your key and try again.</div>';
      }
    };
  } else if (view === 'share-link'){
    modalBody.innerHTML = `
      <h2>Shared list is live 🎉</h2>
      <p>Send this link to Rhys and Jack — anyone who opens it sees the same live tracker. Only this device can mark pubs (your master key is saved locally here).</p>
      <div class="modal-link-box">
        <input type="text" id="modal-share-url" value="${opts.url}" readonly>
        <button class="modal-copy-btn" id="modal-copy-btn">Copy</button>
      </div>
      <p style="font-size:0.75rem;">Note: this link only works once the file itself is hosted somewhere with a real URL — if you're viewing this from a downloaded file, host it first, then re-open it from that hosted URL.</p>
      <button class="modal-btn secondary" id="modal-done-btn">Done</button>
    `;
    document.getElementById('modal-copy-btn').onclick = ()=>{
      const input = document.getElementById('modal-share-url');
      input.select();
      navigator.clipboard && navigator.clipboard.writeText(input.value).catch(()=>{ document.execCommand('copy'); });
      document.getElementById('modal-copy-btn').textContent = 'Copied!';
      setTimeout(()=>{ document.getElementById('modal-copy-btn').textContent = 'Copy'; }, 1500);
    };
    document.getElementById('modal-done-btn').onclick = closeModal;
  } else if (view === 'enter-key'){
    modalBody.innerHTML = `
      <h2>Get edit access</h2>
      <p>You're viewing this shared list read-only. If you're the tracker's master, paste your saved X-Master-Key to enable editing on this device.</p>
      <input type="text" id="modal-key-input2" placeholder="Paste your X-Master-Key here">
      <div id="modal-msg2"></div>
      <button class="modal-btn" id="modal-unlock-btn">Enable editing</button>
      <button class="modal-btn secondary" id="modal-cancel-btn2">Cancel</button>
    `;
    document.getElementById('modal-cancel-btn2').onclick = closeModal;
    document.getElementById('modal-unlock-btn').onclick = async ()=>{
      const key = document.getElementById('modal-key-input2').value.trim();
      const msgEl = document.getElementById('modal-msg2');
      if (!key){ msgEl.innerHTML = '<div class="modal-error">Paste your key first.</div>'; return; }
      msgEl.innerHTML = '<div class="modal-error" style="color:var(--ink-soft);">Checking…</div>';
      try{
        masterKey = key;
        await pushRemote();
        localStorage.setItem('pubcrawl-master-'+binId, key);
        syncMode = 'master';
        updateSyncChip();
        closeModal();
      }catch(e){
        masterKey = null;
        msgEl.innerHTML = '<div class="modal-error">That key didn\'t work for this shared list.</div>';
      }
    };
  }
}

function wireControls(){
  document.getElementById('modal-close').addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e)=>{ if (e.target === modalOverlay) closeModal(); });
  wireDetailContainer(modalBody); // one-time: handles star/toggle taps inside the pub-detail modal
  syncChip.addEventListener('click', ()=>{
    if (syncMode === 'solo') openModal('setup');
    else if (syncMode === 'master') openModal('share-link', { url: location.href });
    else openModal('enter-key');
  });
  document.getElementById('search').addEventListener('input', applyFilters);
  document.querySelectorAll('.chip[data-filter]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.chip[data-filter]').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      applyFilters();
    });
  });
  document.querySelectorAll('.chip[data-person]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.chip[data-person]').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activePerson = chip.dataset.person;
      Object.keys(markers).forEach(id => refreshMarker(id));
      applyFilters();
    });
  });
  document.getElementById('view-toggle-chip').addEventListener('click', function(){
    switchView(this.dataset.view === 'map' ? 'list' : 'map');
  });
}

async function init(){
  map = L.map('map', { zoomControl:true }).setView([52.408, -1.51], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);

  const params = new URLSearchParams(location.search);
  binId = params.get('bin');

  if (binId){
    masterKey = localStorage.getItem('pubcrawl-master-'+binId);
    syncMode = masterKey ? 'master' : 'viewer';
    showStatus('<span class="spinner"></span> Loading shared list…');
    try{
      visited = await fetchRemote();
      hideStatus();
    }catch(e){
      visited = {};
      showStatus('⚠️ Could not reach the shared list — showing empty map');
      setTimeout(hideStatus, 3500);
    }
    startPolling();
  } else {
    syncMode = 'solo';
    loadSolo();
  }

  // One-time migration: convert any old position-based ids to stable name+postcode ids
  const migration = migrateVisited(visited);
  if (migration.changed){
    visited = migration.data;
    if (syncMode === 'master'){
      try{ await pushRemote(); }catch(e){}
    } else if (syncMode === 'solo'){
      saveSolo();
    }
    // viewers: local migrated copy is used for this session; the master's next save will
    // persist the migrated version for everyone once they open the app.
  }

  updateSyncChip();
  updateStats();

  const placed = buildMarkers();
  if (placed < PUBS.length){
    showStatus(`Placed ${placed}/${PUBS.length} pubs on the map`);
    setTimeout(hideStatus, 3000);
  }

  wireControls();
  applyFilters();
}

init();
</script>
</body>
